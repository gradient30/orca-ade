name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  workflow_run:
    workflows: ["Sync Orca Releases"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "1"
      VITE_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Sync official Orca Releases
        run: node --experimental-strip-types scripts/sync-releases.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh official docs fingerprints
        run: node --experimental-strip-types scripts/sync-official-map.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit synced fallback if tags moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/docs/releases.ts src/content/zh/changelog.md src/lib/docs/official-map.json
          if git diff --cached --quiet; then
            echo "no release or map changes"
            exit 0
          fi
          if git diff --cached --name-only | grep -q 'changelog.md\|releases.ts'; then
            git commit -m "chore: 同步官方最新 Orca Release"
          else
            git commit -m "chore: 记录官方手册指纹"
          fi
          git push
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
